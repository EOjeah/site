name: Check and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, canary]
  workflow_dispatch:

permissions:
  contents: read

# Keep production runs queued; newer preview/PR runs can replace older ones.
concurrency:
  group: blog-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Save built site
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'canary')) ||
      (github.event_name == 'workflow_dispatch' && (github.ref_name == 'main' || github.ref_name == 'canary'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'canary' }}
    env:
      WRANGLER_SEND_METRICS: 'false'
      DEPLOY_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore built site
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: dist/

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Add CLOUDFLARE_API_TOKEN to the selected GitHub environment}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Add CLOUDFLARE_ACCOUNT_ID to the selected GitHub environment}"
          : "${PAGES_PROJECT:?Add CLOUDFLARE_PAGES_PROJECT to the selected GitHub environment}"
          npm exec -- wrangler pages deploy dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$DEPLOY_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA"
