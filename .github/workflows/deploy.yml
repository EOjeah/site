name: Check and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, canary]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: site
    timeout-minutes: 10
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # PRs are checked without deployment credentials. Only these branches publish.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'canary')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID variable}"
          : "${PAGES_PROJECT:?Set the CLOUDFLARE_PAGES_PROJECT variable}"
          npm exec -- wrangler pages deploy dist --project-name="$PAGES_PROJECT" --branch="$DEPLOY_BRANCH"
